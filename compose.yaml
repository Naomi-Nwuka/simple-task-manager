services:

  node:
    build: .
    image: node-image:1
    ports:
      - "8081:3000"
    environment:
      DB_HOST: postgres
      DB_USER: taskuser
      DB_PASSWORD: taskpass
      DB_NAME: tasks
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass
      POSTGRES_DB: tasks
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
