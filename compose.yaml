services:

  frontend:
    image: task-frontend
    ports: 
      - "8083:80"
    depends_on: 
      - backend 

  backend:
    image: task-backend
    ports:
      - "8082:3000"
    environment:
      DB_HOST: postgres
      DB_USER: taskuser
      DB_PASSWORD: taskpass
      DB_NAME: tasks
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass
      POSTGRES_DB: tasks
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "taskuser", "-d", "tasks"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
