<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>

  <style>
    :root {
      --background: #f4f5f9;
      --surface: #ffffff;
      --text: #252638;
      --muted: #77798b;
      --border: #e6e7ee;
      --primary: #6558d3;
      --primary-hover: #5145bd;
      --danger: #df4c5b;
      --success: #259b70;
      --shadow: 0 8px 25px rgba(30, 30, 60, 0.06);
    }

    body.dark {
      --background: #171821;
      --surface: #222431;
      --text: #f3f3f7;
      --muted: #a5a6b5;
      --border: #383a49;
      --primary: #9387ff;
      --primary-hover: #8073ed;
      --danger: #ff7180;
      --success: #48c99a;
      --shadow: 0 8px 25px rgba(0, 0, 0, 0.18);
    }

    body.pink {
      --background: #fff1f6;
      --surface: #ffffff;
      --text: #402c39;
      --muted: #987b8c;
      --border: #f3dce7;
      --primary: #d65d96;
      --primary-hover: #bd477f;
      --danger: #df4c5b;
      --success: #259b70;
      --shadow: 0 8px 25px rgba(100, 40, 75, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--background);
      color: var(--text);
      font-family: Arial, sans-serif;
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
    }

    button, input, select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-card {
      background: var(--surface);
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border-radius: 16px;
      box-shadow: var(--shadow);
    }

    .auth-card h1 {
      font-size: 27px;
      margin-bottom: 8px;
    }

    .auth-card > p {
      color: var(--muted);
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .auth-card label,
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 7px;
    }

    .auth-card input,
    .form-group input,
    .form-group select,
    .filter-control {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      outline: none;
    }

    .auth-card input:focus,
    .form-group input:focus,
    .form-group select:focus,
    .filter-control:focus {
      border-color: var(--primary);
    }

    .auth-card .form-group {
      margin-bottom: 17px;
    }

    .primary-button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.2s;
    }

    .primary-button:hover {
      background: var(--primary-hover);
    }

    .auth-submit {
      width: 100%;
      margin-top: 5px;
    }

    .auth-switch {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      color: var(--muted);
    }

    .auth-switch button {
      background: none;
      border: none;
      color: var(--primary);
      font-weight: 600;
    }

    .auth-message {
      color: var(--danger);
      font-size: 13px;
      margin-top: 12px;
      line-height: 1.4;
    }

    .app-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      font-size: 21px;
      font-weight: 700;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .welcome-text {
      color: var(--muted);
      font-size: 14px;
    }

    .icon-button {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      width: 39px;
      height: 39px;
      border-radius: 9px;
      font-size: 18px;
    }

    .logout-button {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
    }

    .container {
      max-width: 1150px;
      margin: 35px auto;
      padding: 0 20px 40px;
    }

    .page-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      gap: 15px;
    }

    .page-heading h1 {
      font-size: 27px;
      margin-bottom: 6px;
    }

    .page-heading p {
      color: var(--muted);
      font-size: 14px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .stat-card p {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 12px;
    }

    .stat-card h2 {
      font-size: 27px;
    }

    .content-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 22px;
      box-shadow: var(--shadow);
    }

    .section-heading {
      font-size: 17px;
      margin-bottom: 18px;
    }

    .task-form {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr auto;
      gap: 12px;
      align-items: end;
    }

    .form-group {
      min-width: 0;
    }

    .task-form .primary-button {
      height: 42px;
      white-space: nowrap;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 2fr repeat(5, 1fr);
      gap: 12px;
    }

    .filter-control {
      min-width: 0;
      font-size: 13px;
    }

    .task-list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      gap: 12px;
    }

    .task-count {
      color: var(--muted);
      font-size: 13px;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .task-checkbox {
      width: 19px;
      height: 19px;
      accent-color: var(--primary);
      flex-shrink: 0;
      cursor: pointer;
    }

    .task-details {
      flex: 1;
      min-width: 0;
    }

    .task-title {
      font-size: 15px;
      font-weight: 600;
      overflow-wrap: anywhere;
      margin-bottom: 8px;
    }

    .task-item.completed .task-title {
      text-decoration: line-through;
      color: var(--muted);
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      text-transform: capitalize;
      background: var(--background);
      color: var(--muted);
    }

    .priority-high {
      background: #ffe7e9;
      color: #c83d4c;
    }

    .priority-medium {
      background: #fff1d7;
      color: #a36b12;
    }

    .priority-low {
      background: #e2f5eb;
      color: #258354;
    }

    .overdue-badge {
      background: #ffe7e9;
      color: #c83d4c;
    }

    .task-actions {
      display: flex;
      gap: 7px;
      flex-shrink: 0;
    }

    .task-action {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 7px;
      font-size: 13px;
    }

    .task-action:hover {
      border-color: var(--primary);
    }

    .delete-button:hover {
      color: var(--danger);
      border-color: var(--danger);
    }

    .empty-state {
      text-align: center;
      padding: 40px 15px;
      color: var(--muted);
      line-height: 1.6;
    }

    .loading {
      text-align: center;
      padding: 25px;
      color: var(--muted);
    }

    .notification {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--text);
      color: var(--surface);
      padding: 13px 18px;
      border-radius: 8px;
      box-shadow: var(--shadow);
      z-index: 100;
      max-width: 320px;
      font-size: 14px;
    }

    @media (max-width: 900px) {
      .task-form {
        grid-template-columns: repeat(2, 1fr);
      }

      .task-form .form-group:first-child {
        grid-column: span 2;
      }

      .task-form .primary-button {
        grid-column: span 2;
      }

      .filter-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .filter-grid input {
        grid-column: span 3;
      }
    }

    @media (max-width: 600px) {
      .app-header {
        padding: 15px 18px;
      }

      .welcome-text {
        display: none;
      }

      .container {
        margin-top: 25px;
        padding: 0 14px 30px;
      }

      .page-heading h1 {
        font-size: 23px;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }

      .stat-card {
        padding: 15px;
      }

      .stat-card h2 {
        font-size: 23px;
      }

      .content-card {
        padding: 16px;
      }

      .task-form {
        grid-template-columns: 1fr 1fr;
      }

      .filter-grid {
        grid-template-columns: 1fr 1fr;
      }

      .filter-grid input {
        grid-column: span 2;
      }

      .task-item {
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .task-details {
        width: calc(100% - 40px);
      }

      .task-actions {
        width: 100%;
        padding-left: 32px;
      }

      .auth-card {
        padding: 25px;
      }

      .logout-button {
        padding: 9px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <!-- Authentication -->
  <section id="authSection" class="auth-container">
    <div class="auth-card">
      <h1 id="authTitle">Welcome back</h1>
      <p id="authDescription">Log in to manage your tasks.</p>

      <form id="authForm">
        <div id="nameGroup" class="form-group hidden">
          <label for="authName">Name</label>
          <input
            type="text"
            id="authName"
            placeholder="Your name"
            autocomplete="name"
          >
        </div>

        <div class="form-group">
          <label for="authEmail">Email address</label>
          <input
            type="email"
            id="authEmail"
            placeholder="you@example.com"
            required
            autocomplete="email"
          >
        </div>

        <div class="form-group">
          <label for="authPassword">Password</label>
          <input
            type="password"
            id="authPassword"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" id="authSubmit" class="primary-button auth-submit">
          Log In
        </button>

        <p id="authMessage" class="auth-message"></p>
      </form>

      <div class="auth-switch">
        <span id="authSwitchText">Do not have an account?</span>
        <button type="button" id="authSwitchButton">Sign Up</button>
      </div>
    </div>
  </section>

  <!-- Main Application -->
  <div id="appSection" class="hidden">

    <header class="app-header">
      <div class="brand">✓ Task Manager</div>

      <div class="header-actions">
        <span id="welcomeText" class="welcome-text"></span>

        <button
          type="button"
          id="themeButton"
          class="icon-button"
          title="Change theme"
          aria-label="Change theme"
        >
          ☀️
        </button>

        <button type="button" id="logoutButton" class="logout-button">
          Log Out
        </button>
      </div>
    </header>

    <main class="container">

      <div class="page-heading">
        <div>
          <h1>My Dashboard</h1>
          <p>Keep track of your tasks and stay organised.</p>
        </div>
      </div>

      <!-- Dashboard statistics -->
      <section class="stats-grid">
        <div class="stat-card">
          <p>Total Tasks</p>
          <h2 id="totalTasks">0</h2>
        </div>

        <div class="stat-card">
          <p>Completed</p>
          <h2 id="completedTasks">0</h2>
        </div>

        <div class="stat-card">
          <p>Pending</p>
          <h2 id="pendingTasks">0</h2>
        </div>

        <div class="stat-card">
          <p>Overdue</p>
          <h2 id="overdueTasks">0</h2>
        </div>
      </section>

      <!-- Add task -->
      <section class="content-card">
        <h2 class="section-heading">Add a New Task</h2>

        <form id="taskForm" class="task-form">
          <div class="form-group">
            <label for="taskTitle">Task title</label>
            <input
              type="text"
              id="taskTitle"
              placeholder="What do you need to do?"
              maxlength="200"
              required
            >
          </div>

          <div class="form-group">
            <label for="taskPriority">Priority</label>
            <select id="taskPriority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>

          <div class="form-group">
            <label for="taskCategory">Category</label>
            <select id="taskCategory">
              <option value="work">Work</option>
              <option value="personal">Personal</option>
              <option value="shopping">Shopping</option>
              <option value="other" selected>Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="taskDueDate">Due date</label>
            <input type="date" id="taskDueDate">
          </div>

          <button type="submit" class="primary-button">
            + Add Task
          </button>
        </form>
      </section>

      <!-- Search and filters -->
      <section class="content-card">
        <h2 class="section-heading">Find Your Tasks</h2>

        <div class="filter-grid">
          <input
            type="search"
            id="searchInput"
            class="filter-control"
            placeholder="Search task titles..."
          >

          <select id="categoryFilter" class="filter-control">
            <option value="">All Categories</option>
            <option value="work">Work</option>
            <option value="personal">Personal</option>
            <option value="shopping">Shopping</option>
            <option value="other">Other</option>
          </select>

          <select id="priorityFilter" class="filter-control">
            <option value="">All Priorities</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>

          <select id="statusFilter" class="filter-control">
            <option value="">All Statuses</option>
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
          </select>

          <select id="overdueFilter" class="filter-control">
            <option value="">All Due Dates</option>
            <option value="true">Overdue Only</option>
          </select>

          <select id="sortFilter" class="filter-control">
            <option value="created_at">Newest First</option>
            <option value="due_date">Due Date</option>
            <option value="priority">Priority</option>
            <option value="title">Title</option>
          </select>
        </div>
      </section>

      <!-- Task list -->
      <section class="content-card">
        <div class="task-list-header">
          <h2 class="section-heading" style="margin-bottom: 0;">
            My Tasks
          </h2>

          <span id="taskCount" class="task-count">0 tasks</span>
        </div>

        <div id="taskList" class="task-list">
          <div class="loading">Loading tasks...</div>
        </div>
      </section>

    </main>
  </div>

  <div id="notification" class="notification hidden"></div>

  <script>
    const API_URL = "http://localhost:8082";

    const authSection = document.getElementById("authSection");
    const appSection = document.getElementById("appSection");
    const authForm = document.getElementById("authForm");
    const authTitle = document.getElementById("authTitle");
    const authDescription = document.getElementById("authDescription");
    const authSubmit = document.getElementById("authSubmit");
    const authSwitchText = document.getElementById("authSwitchText");
    const authSwitchButton = document.getElementById("authSwitchButton");
    const authMessage = document.getElementById("authMessage");
    const nameGroup = document.getElementById("nameGroup");

    const taskForm = document.getElementById("taskForm");
    const taskList = document.getElementById("taskList");

    let isRegistering = false;
    let tasks = [];
    let currentUser = null;
    let notificationTimer;

    const token = () => localStorage.getItem("taskManagerToken");

    async function apiRequest(path, options = {}) {
      const headers = {
        "Content-Type": "application/json",
        ...(options.headers || {})
      };

      if (token()) {
        headers.Authorization = `Bearer ${token()}`;
      }

      const response = await fetch(`${API_URL}${path}`, {
        ...options,
        headers
      });

      const text = await response.text();

      let data = {};

      if (text) {
        try {
          data = JSON.parse(text);
        } catch {
          data = { message: text };
        }
      }

      if (!response.ok) {
        if (response.status === 401 && token()) {
          logout(false);
        }

        throw new Error(
          data.message || data.error || "Something went wrong."
        );
      }

      return data;
    }

    function showNotification(message) {
      const notification = document.getElementById("notification");

      notification.textContent = message;
      notification.classList.remove("hidden");

      clearTimeout(notificationTimer);

      notificationTimer = setTimeout(() => {
        notification.classList.add("hidden");
      }, 3000);
    }

    function showAuthMessage(message) {
      authMessage.textContent = message;
    }

    function switchAuthMode() {
      isRegistering = !isRegistering;

      authTitle.textContent = isRegistering
        ? "Create your account"
        : "Welcome back";

      authDescription.textContent = isRegistering
        ? "Sign up to start organising your tasks."
        : "Log in to manage your tasks.";

      authSubmit.textContent = isRegistering
        ? "Create Account"
        : "Log In";

      authSwitchText.textContent = isRegistering
        ? "Already have an account?"
        : "Do not have an account?";

      authSwitchButton.textContent = isRegistering
        ? "Log In"
        : "Sign Up";

      nameGroup.classList.toggle("hidden", !isRegistering);

      document.getElementById("authName").required = isRegistering;
      document.getElementById("authPassword").autocomplete =
        isRegistering ? "new-password" : "current-password";

      showAuthMessage("");
    }

    authSwitchButton.addEventListener("click", switchAuthMode);

    authForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      showAuthMessage("");
      authSubmit.disabled = true;

      const email = document.getElementById("authEmail").value.trim();
      const password = document.getElementById("authPassword").value;
      const name = document.getElementById("authName").value.trim();

      try {
        const endpoint = isRegistering
          ? "/auth/register"
          : "/auth/login";

        const body = isRegistering
          ? { name, email, password }
          : { email, password };

        const data = await apiRequest(endpoint, {
          method: "POST",
          body: JSON.stringify(body)
        });

        localStorage.setItem("taskManagerToken", data.token);

        await loadApplication();
      } catch (error) {
        showAuthMessage(error.message);
      } finally {
        authSubmit.disabled = false;
      }
    });

    async function loadApplication() {
      try {
        const data = await apiRequest("/auth/me");

        currentUser = data.user;

        authSection.classList.add("hidden");
        appSection.classList.remove("hidden");

        document.getElementById("welcomeText").textContent =
          `Hello, ${currentUser.name}`;

        await loadTasks();
      } catch (error) {
        logout(false);
        showAuthMessage(error.message);
      }
    }

    function logout(showMessage = true) {
      localStorage.removeItem("taskManagerToken");

      currentUser = null;
      tasks = [];

      appSection.classList.add("hidden");
      authSection.classList.remove("hidden");

      if (showMessage) {
        showAuthMessage("");
        showNotification("You have logged out.");
      }
    }

    document.getElementById("logoutButton").addEventListener(
      "click",
      () => logout()
    );

    // Theme selection
    const themeButton = document.getElementById("themeButton");
    const themes = ["light", "dark", "pink"];

    let currentTheme = localStorage.getItem("taskManagerTheme") || "light";

    function applyTheme() {
      document.body.classList.remove("dark", "pink");

      if (currentTheme !== "light") {
        document.body.classList.add(currentTheme);
      }

      themeButton.textContent = {
        light: "☀️",
        dark: "🌙",
        pink: "🌸"
      }[currentTheme];
    }

    themeButton.addEventListener("click", () => {
      const currentIndex = themes.indexOf(currentTheme);

      currentTheme = themes[(currentIndex + 1) % themes.length];

      localStorage.setItem("taskManagerTheme", currentTheme);

      applyTheme();
    });

    applyTheme();

    // Task creation
    taskForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const title = document.getElementById("taskTitle").value.trim();

      if (!title) {
        showNotification("Please enter a task title.");
        return;
      }

      const task = {
        title,
        priority: document.getElementById("taskPriority").value,
        category: document.getElementById("taskCategory").value,
        due_date: document.getElementById("taskDueDate").value || null
      };

      try {
        await apiRequest("/tasks", {
          method: "POST",
          body: JSON.stringify(task)
        });

        taskForm.reset();

        document.getElementById("taskPriority").value = "medium";
        document.getElementById("taskCategory").value = "other";

        await loadTasks();

        showNotification("Task added successfully.");
      } catch (error) {
        showNotification(error.message);
      }
    });

    // Build task query from filters
    function getTaskQuery() {
      const params = new URLSearchParams();

      const search = document.getElementById("searchInput").value.trim();
      const category = document.getElementById("categoryFilter").value;
      const priority = document.getElementById("priorityFilter").value;
      const status = document.getElementById("statusFilter").value;
      const overdue = document.getElementById("overdueFilter").value;
      const sort = document.getElementById("sortFilter").value;

      if (search) params.set("search", search);
      if (category) params.set("category", category);
      if (priority) params.set("priority", priority);
      if (status) params.set("status", status);
      if (overdue) params.set("overdue", overdue);

      if (sort) params.set("sort", sort);

      return params.toString();
    }

    async function loadTasks() {
      taskList.innerHTML = '<div class="loading">Loading tasks...</div>';

      try {
        const query = getTaskQuery();

        const data = await apiRequest(
          `/tasks${query ? `?${query}` : ""}`
        );

        tasks = Array.isArray(data) ? data : data.tasks || [];

        renderTasks();
        updateDashboard();
      } catch (error) {
        taskList.innerHTML = `
          <div class="empty-state">
            Could not load tasks.<br>
            ${escapeHTML(error.message)}
          </div>
        `;
      }
    }

    // Dashboard statistics
    function isOverdue(task) {
      if (!task.due_date || task.completed) {
        return false;
      }

      const dueDate = String(task.due_date).slice(0, 10);

      const today = new Date();
      const todayString =
        `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}-${String(today.getDate()).padStart(2, "0")}`;

      return dueDate < todayString;
    }

    function updateDashboard() {
      const total = tasks.length;
      const completed = tasks.filter(task => task.completed).length;
      const pending = total - completed;
      const overdue = tasks.filter(isOverdue).length;

      document.getElementById("totalTasks").textContent = total;
      document.getElementById("completedTasks").textContent = completed;
      document.getElementById("pendingTasks").textContent = pending;
      document.getElementById("overdueTasks").textContent = overdue;

      document.getElementById("taskCount").textContent =
        `${total} ${total === 1 ? "task" : "tasks"}`;
    }

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[character]);
    }

    function formatDate(date) {
      if (!date) return "No due date";

      const dateString = String(date).slice(0, 10);
      const parsed = new Date(`${dateString}T00:00:00`);

      if (Number.isNaN(parsed.getTime())) {
        return "No due date";
      }

      return parsed.toLocaleDateString(undefined, {
        day: "numeric",
        month: "short",
        year: "numeric"
      });
    }

    // Display tasks
    function renderTasks() {
      if (tasks.length === 0) {
        taskList.innerHTML = `
          <div class="empty-state">
            <h3>No tasks found</h3>
            <p>Add a task or adjust your search and filters.</p>
          </div>
        `;

        return;
      }

      taskList.innerHTML = tasks.map(task => {
        const overdue = isOverdue(task);

        return `
          <article class="task-item ${task.completed ? "completed" : ""}"
                   data-id="${Number(task.id)}">

            <input
              type="checkbox"
              class="task-checkbox"
              data-action="toggle"
              aria-label="Mark task as completed"
              ${task.completed ? "checked" : ""}
            >

            <div class="task-details">
              <div class="task-title">${escapeHTML(task.title)}</div>

              <div class="task-meta">
                <span class="badge priority-${escapeHTML(task.priority)}">
                  ${escapeHTML(task.priority)}
                </span>

                <span class="badge">
                  ${escapeHTML(task.category || "other")}
                </span>

                <span class="badge">
                  ${escapeHTML(formatDate(task.due_date))}
                </span>

                ${overdue
                  ? '<span class="badge overdue-badge">Overdue</span>'
                  : ""
                }

                ${task.completed
                  ? '<span class="badge">Completed</span>'
                  : ""
                }
              </div>
            </div>

            <div class="task-actions">
              <button
                type="button"
                class="task-action"
                data-action="edit"
              >
                Edit
              </button>

              <button
                type="button"
                class="task-action delete-button"
                data-action="delete"
              >
                Delete
              </button>
            </div>
          </article>
        `;
      }).join("");
    }

    // Task list actions
    taskList.addEventListener("click", async (event) => {
      const button = event.target.closest("[data-action]");

      if (!button) return;

      const taskElement = button.closest(".task-item");

      if (!taskElement) return;

      const taskId = Number(taskElement.dataset.id);
      const action = button.dataset.action;

      if (action === "edit") {
        editTask(taskId);
      }

      if (action === "delete") {
        deleteTask(taskId);
      }
    });

    taskList.addEventListener("change", async (event) => {
      if (!event.target.matches('[data-action="toggle"]')) {
        return;
      }

      const taskElement = event.target.closest(".task-item");

      if (!taskElement) return;

      await toggleTask(Number(taskElement.dataset.id));
    });

    async function toggleTask(taskId) {
      try {
        await apiRequest(`/tasks/${taskId}`, {
          method: "PUT"
        });

        await loadTasks();

        showNotification("Task status updated.");
      } catch (error) {
        showNotification(error.message);
        await loadTasks();
      }
    }

    async function editTask(taskId) {
      const task = tasks.find(item => item.id === taskId);

      if (!task) return;

      const newTitle = prompt("Edit task title:", task.title);

      if (newTitle === null) return;

      const title = newTitle.trim();

      if (!title) {
        showNotification("Task title cannot be empty.");
        return;
      }

      const priority = prompt(
        "Priority: low, medium, or high",
        task.priority
      );

      if (priority === null) return;

      if (!["low", "medium", "high"].includes(priority.toLowerCase())) {
        showNotification("Please enter low, medium, or high.");
        return;
      }

      const category = prompt(
        "Category: work, personal, shopping, or other",
        task.category || "other"
      );

      if (category === null) return;

      if (!["work", "personal", "shopping", "other"].includes(category.toLowerCase())) {
        showNotification("Please enter a valid category.");
        return;
      }

      const dueDate = prompt(
        "Due date (YYYY-MM-DD). Leave blank to remove the due date.",
        task.due_date ? String(task.due_date).slice(0, 10) : ""
      );

      if (dueDate === null) return;

      if (dueDate && !/^\d{4}-\d{2}-\d{2}$/.test(dueDate)) {
        showNotification("Please use the date format YYYY-MM-DD.");
        return;
      }

      try {
        await apiRequest(`/tasks/${taskId}`, {
          method: "PATCH",
          body: JSON.stringify({
            title,
            priority: priority.toLowerCase(),
            category: category.toLowerCase(),
            due_date: dueDate || null
          })
        });

        await loadTasks();

        showNotification("Task updated successfully.");
      } catch (error) {
        showNotification(error.message);
      }
    }

    async function deleteTask(taskId) {
      const confirmed = confirm("Are you sure you want to delete this task?");

      if (!confirmed) return;

      try {
        await apiRequest(`/tasks/${taskId}`, {
          method: "DELETE"
        });

        await loadTasks();

        showNotification("Task deleted.");
      } catch (error) {
        showNotification(error.message);
      }
    }

    // Search and filter events
    let searchTimer;

    document.getElementById("searchInput").addEventListener(
      "input",
      () => {
        clearTimeout(searchTimer);

        searchTimer = setTimeout(loadTasks, 300);
      }
    );

    [
      "categoryFilter",
      "priorityFilter",
      "statusFilter",
      "overdueFilter",
      "sortFilter"
    ].forEach(id => {
      document.getElementById(id).addEventListener("change", loadTasks);
    });

    // Start the application
    if (token()) {
      loadApplication();
    }
  </script>

</body>
</html>
