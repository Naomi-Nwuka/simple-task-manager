<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f5f9;
      color: #333;
      min-height: 100vh;
      padding: 30px 15px;
      transition: background 0.3s, color 0.3s;
    }

    .container {
      max-width: 950px;
      margin: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 30px;
    }

    .theme-select {
      width: 65px;
      height: 45px;
      padding: 5px 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      font-size: 20px;
      text-align: center;
      appearance: auto;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .stat-card p {
      font-size: 14px;
      color: #777;
      margin-bottom: 10px;
    }

    .stat-card h2 {
      font-size: 28px;
    }

    .total h2 { color: #4f46e5; }
    .completed-stat h2 { color: #16a34a; }
    .pending-stat h2 { color: #d97706; }
    .overdue-stat h2 { color: #dc2626; }

    .task-section {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.06);
    }

    .task-section h2 {
      margin-bottom: 20px;
    }

    .task-form {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 10px;
      margin-bottom: 25px;
    }

    input, select, button {
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    input, select {
      min-width: 0;
    }

    button {
      border: none;
      background: #4f46e5;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      opacity: 0.9;
    }

    .task-list {
      list-style: none;
    }

    .task-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .task-left {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .task-checkbox {
      width: 18px;
      height: 18px;
      margin-top: 3px;
      cursor: pointer;
      accent-color: #4f46e5;
    }

    .task-details {
      min-width: 0;
    }

    .task-title {
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .task-title.completed {
      color: #999;
    }

    .task-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
      font-size: 12px;
    }

    .priority {
      padding: 4px 8px;
      border-radius: 20px;
      font-weight: bold;
      text-transform: capitalize;
    }

    .priority.low {
      background: #dcfce7;
      color: #166534;
    }

    .priority.medium {
      background: #fef3c7;
      color: #92400e;
    }

    .priority.high {
      background: #fee2e2;
      color: #991b1b;
    }

    .due-date {
      color: #666;
    }

    .overdue-label {
      color: #dc2626;
      font-weight: bold;
    }

    .delete-btn {
      background: #ef4444;
      padding: 9px 12px;
      flex-shrink: 0;
    }

    .empty-message {
      text-align: center;
      color: #888;
      padding: 25px 0;
    }

    /* DARK THEME */

    body.dark {
      background: #18181b;
      color: #f4f4f5;
    }

    body.dark .task-section,
    body.dark .stat-card {
      background: #27272a;
      color: #f4f4f5;
    }

    body.dark .task-item {
      border-color: #444;
    }

    body.dark .task-title.completed {
      color: #888;
    }

    body.dark .due-date,
    body.dark .stat-card p {
      color: #aaa;
    }

    body.dark input,
    body.dark select {
      background: #3f3f46;
      color: white;
      border-color: #555;
    }

    body.dark .theme-select {
      background: #3f3f46;
      color: white;
    }

    /* PINK THEME */

    body.pink {
      background: #fff0f6;
      color: #831843;
    }

    body.pink .task-section,
    body.pink .stat-card {
      background: #fff;
      color: #831843;
    }

    body.pink button {
      background: #db2777;
    }

    body.pink .task-checkbox {
      accent-color: #db2777;
    }

    body.pink .total h2,
    body.pink .completed-stat h2,
    body.pink .pending-stat h2,
    body.pink .overdue-stat h2 {
      color: #db2777;
    }

    @media (max-width: 700px) {
      .dashboard {
        grid-template-columns: repeat(2, 1fr);
      }

      .task-form {
        grid-template-columns: 1fr 1fr;
      }

      .task-form input:first-child {
        grid-column: 1 / -1;
      }

      .task-form button {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 400px) {
      header {
        align-items: flex-start;
        flex-direction: column;
      }

      .task-section {
        padding: 18px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <header>
      <h1>My Task Manager</h1>

      <select
        class="theme-select"
        id="themeSelect"
        onchange="changeTheme()"
        aria-label="Choose theme"
        title="Choose theme"
      >
        <option value="light">☀️</option>
        <option value="dark">🌙</option>
        <option value="pink">🌸</option>
      </select>
    </header>

    <section class="dashboard">
      <div class="stat-card total">
        <p>Total Tasks</p>
        <h2 id="totalTasks">0</h2>
      </div>

      <div class="stat-card completed-stat">
        <p>Completed</p>
        <h2 id="completedTasks">0</h2>
      </div>

      <div class="stat-card pending-stat">
        <p>Pending</p>
        <h2 id="pendingTasks">0</h2>
      </div>

      <div class="stat-card overdue-stat">
        <p>Overdue</p>
        <h2 id="overdueTasks">0</h2>
      </div>
    </section>

    <section class="task-section">
      <h2>My Tasks</h2>

      <form class="task-form" id="taskForm">
        <input
          type="text"
          id="taskInput"
          placeholder="What needs to be done?"
          required
        >

        <select id="priorityInput">
          <option value="low">Low Priority</option>
          <option value="medium" selected>Medium Priority</option>
          <option value="high">High Priority</option>
        </select>

        <input type="date" id="dueDateInput">

        <button type="submit">Add Task</button>
      </form>

      <ul class="task-list" id="taskList"></ul>
    </section>

  </div>

  <script>
    const API_URL = "http://localhost:8082";

    let tasks = [];

    async function loadTasks() {
      try {
        const response = await fetch(`${API_URL}/tasks`);

        if (!response.ok) {
          throw new Error("Could not load tasks");
        }

        tasks = await response.json();

        updateDashboard();
        displayTasks();

      } catch (error) {
        console.error("Error loading tasks:", error);
        alert("Unable to load tasks. Please check that the application is running.");
      }
    }

    function updateDashboard() {
      const total = tasks.length;

      const completed = tasks.filter(task => task.completed).length;

      const pending = total - completed;

      const today = getTodayDate();

      const overdue = tasks.filter(task => {
        return (
          !task.completed &&
          task.due_date &&
          String(task.due_date).slice(0, 10) < today
        );
      }).length;

      document.getElementById("totalTasks").textContent = total;
      document.getElementById("completedTasks").textContent = completed;
      document.getElementById("pendingTasks").textContent = pending;
      document.getElementById("overdueTasks").textContent = overdue;
    }

    function getTodayDate() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, "0");
      const day = String(today.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function displayTasks() {
      const taskList = document.getElementById("taskList");

      taskList.innerHTML = "";

      if (tasks.length === 0) {
        const message = document.createElement("li");
        message.className = "empty-message";
        message.textContent = "No tasks yet. Add your first task above!";
        taskList.appendChild(message);
        return;
      }

      tasks.forEach(task => {
        const listItem = document.createElement("li");
        listItem.className = "task-item";

        const taskLeft = document.createElement("div");
        taskLeft.className = "task-left";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "task-checkbox";
        checkbox.checked = task.completed;
        checkbox.addEventListener("change", () => toggleTask(task.id));

        const taskDetails = document.createElement("div");
        taskDetails.className = "task-details";

        const title = document.createElement("p");
        title.className = "task-title";

        if (task.completed) {
          title.classList.add("completed");
        }

        title.textContent = task.title;

        const meta = document.createElement("div");
        meta.className = "task-meta";

        const priority = document.createElement("span");
        const priorityValue = task.priority || "medium";

        priority.className = `priority ${priorityValue}`;
        priority.textContent = `${priorityValue} priority`;

        meta.appendChild(priority);

        if (task.due_date) {
          const dueDate = String(task.due_date).slice(0, 10);
          const dueDateElement = document.createElement("span");

          dueDateElement.className = "due-date";
          dueDateElement.textContent = `Due: ${dueDate}`;

          if (!task.completed && dueDate < getTodayDate()) {
            dueDateElement.classList.add("overdue-label");
            dueDateElement.textContent += " (Overdue)";
          }

          meta.appendChild(dueDateElement);
        }

        taskDetails.appendChild(title);
        taskDetails.appendChild(meta);

        taskLeft.appendChild(checkbox);
        taskLeft.appendChild(taskDetails);

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-btn";
        deleteButton.textContent = "Delete";
        deleteButton.addEventListener("click", () => deleteTask(task.id));

        listItem.appendChild(taskLeft);
        listItem.appendChild(deleteButton);

        taskList.appendChild(listItem);
      });
    }

    document.getElementById("taskForm").addEventListener("submit", async function(event) {
      event.preventDefault();

      const title = document.getElementById("taskInput").value.trim();
      const priority = document.getElementById("priorityInput").value;
      const dueDate = document.getElementById("dueDateInput").value;

      if (!title) {
        alert("Please enter a task.");
        return;
      }

      try {
        const response = await fetch(`${API_URL}/tasks`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            title: title,
            priority: priority,
            due_date: dueDate || null
          })
        });

        if (!response.ok) {
          throw new Error("Could not add task");
        }

        document.getElementById("taskInput").value = "";
        document.getElementById("priorityInput").value = "medium";
        document.getElementById("dueDateInput").value = "";

        await loadTasks();

      } catch (error) {
        console.error("Error adding task:", error);
        alert("Unable to add task.");
      }
    });

    async function toggleTask(id) {
      try {
        const response = await fetch(`${API_URL}/tasks/${id}`, {
          method: "PUT"
        });

        if (!response.ok) {
          throw new Error("Could not update task");
        }

        await loadTasks();

      } catch (error) {
        console.error("Error updating task:", error);
        alert("Unable to update task.");
      }
    }

    async function deleteTask(id) {
      const confirmDelete = confirm("Are you sure you want to delete this task?");

      if (!confirmDelete) return;

      try {
        const response = await fetch(`${API_URL}/tasks/${id}`, {
          method: "DELETE"
        });

        if (!response.ok) {
          throw new Error("Could not delete task");
        }

        await loadTasks();

      } catch (error) {
        console.error("Error deleting task:", error);
        alert("Unable to delete task.");
      }
    }

    function changeTheme() {
      const theme = document.getElementById("themeSelect").value;

      document.body.className = theme === "light" ? "" : theme;
      localStorage.setItem("taskManagerTheme", theme);
    }

    function loadTheme() {
      const savedTheme = localStorage.getItem("taskManagerTheme") || "light";

      document.getElementById("themeSelect").value = savedTheme;
      document.body.className = savedTheme === "light" ? "" : savedTheme;
    }

    loadTheme();
    loadTasks();
  </script>
</body>
</html>
